# Runs `make test` (the recorded Agda sessions, without Agda) on the
# oldest Neovim the plugin supports and on the latest release.
name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.11.0, stable]
    name: Neovim ${{ matrix.nvim }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/${{ matrix.nvim }}/nvim-linux-x86_64.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: nvim --version
      - run: make test
